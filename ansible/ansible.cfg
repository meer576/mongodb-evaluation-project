[defaults]
inventory = inventory/aws_ec2.yml
host_key_checking = False
remote_user = ubuntu
private_key_file = /home/meer/key/mongodb-key.pem
interpreter_python = auto_silent

roles_path = ./roles

timeout = 60
forks = 3

[ssh_connection]
ssh_args = -F /home/meer/.ssh/config -o ControlMaster=auto -o ControlPersist=300s
pipelining = True
retries = 3
